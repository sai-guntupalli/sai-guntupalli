name: Deploy to GitHub Pages

# Manual trigger only. Nothing publishes automatically.
# Before first run, set once in GitHub:
#   Settings > Pages > Build and deployment > Source: "GitHub Actions"
# Publishing = Actions tab > "Deploy to GitHub Pages" > Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /sai-guntupalli
      # GitHub's Jekyll processing ignores _next/ unless this marker exists
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4